<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:84px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h2.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  #tolist { display:none; font-size:16px; color:var(--mute); text-decoration:none; font-weight:700; margin-bottom:6px; }
  #nvnote { display:none; background:#FFF3DC; color:#1F2A24; border:2px solid #F0D49A; border-radius:14px; padding:10px 14px; margin:8px 0; font-size:17px; line-height:1.6; text-align:center; }
  #nvnote button { background:var(--acc); color:#fff; padding:0 18px; margin-left:8px; font-size:17px; }
  .nvcard { display:none; margin:34px 0 10px; background:#fff; border:2px solid #DCE6DF; border-radius:16px; padding:18px 20px; }
  .nvcard .lb { color:var(--mute); font-size:16px; }
  .nvcard .nm { font-size:calc(var(--fs) + 2px); font-weight:900; margin:4px 0 14px; line-height:1.5; }
  .nvcard a.go { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; font-weight:900; font-size:19px; border-radius:14px; padding:12px 22px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
</style>

<body>
<div class="wrap">
  <header>
    <a id="tolist" href="#">← 목록으로</a>
    <h1>AI와 은퇴 선교사의 목회적 논쟁</h1>
    <div class="meta" id="meta"></div>
    <div class="rule"></div>
  </header>
  <div id="resume"></div>
  <main id="text"></main>
  <div class="nvcard" id="nvcard"><div class="lb">다음 글</div><div class="nm" id="nvname"></div><a class="go" id="nvgo" href="#">다음 글 열기 ▶</a></div>
</div>

<div class="bar">
  <div id="nvnote"></div>
  <div class="prog" id="prog" aria-label="재생 위치"><i id="fill"></i></div>
  <div class="in">
    <button id="pt" class="o" aria-label="앞 글">앞 글</button>
    <button id="prev" aria-label="앞 문장" title="앞 문장">⏮</button>
    <button id="back" aria-label="10초 뒤로" title="10초 뒤로">↺10</button>
    <button id="play" aria-label="재생">▶ 재생</button>
    <button id="fwd" aria-label="10초 앞으로" title="10초 앞으로">10↻</button>
    <button id="next" aria-label="다음 문장" title="다음 문장">⏭</button>
    <button id="nt" class="o" aria-label="다음 글">다음 글</button>
    <span class="tm"><span id="cur">0:00</span> / <span id="tot">0:00</span></span>
    <button id="spd" class="o" aria-label="재생 속도">1.0x</button>
    <button id="fsm" class="o" aria-label="글자 줄이기">가-</button>
    <button id="fbg" class="o" aria-label="글자 키우기">가+</button>
    <button id="fs" class="o" aria-label="전체 화면" title="전체 화면 (F 키)">⛶ 전체</button>
  </div>

<script>
(function () {
  const TITLE = "AI와 은퇴 선교사의 목회적 논쟁", AUDIO_SRC = "AInon.mp3", DUR = 824, SEGS = [{"t":"AI와 은퇴 선교사의 목회적 논쟁.","s":0,"e":3.021,"p":true,"h":false},{"t":"은혜와 책임.","s":3.456,"e":4.693,"p":false,"h":false},{"t":"대화에서 오간 내용을 \"목사님의 말씀 / AI의 의견 / 합의되지 않은 점.\"으로 나누어 기록한 문서입니다.","s":5.328,"e":13.053,"p":false,"h":false},{"t":"목사님의 말씀은 하신 말씀과 논거를 줄이지 않고 옮겼고, AI의 의견은 AI의 것으로만 표시했습니다.","s":13.248,"e":21.106,"p":true,"h":false},{"t":"1.","s":21.696,"e":22.181,"p":false,"h":false},{"t":"목사님의 주장.","s":22.368,"e":23.705,"p":false,"h":false},{"t":"문제의식: 한국 교회의 설교.","s":24.24,"e":26.787,"p":false,"h":false},{"t":"• 얼마 전 다니던 교회 목사님이 \"은혜로 구원 받았지만 받은 구원에 대한 책임도 있습니다.","s":26.952,"e":33.165,"p":false,"h":false},{"t":"구원 받은 책임으로 말씀대로 살아야 합니다.\"라고 설교하셨습니다.","s":33.504,"e":38.429,"p":false,"h":false},{"t":"한국 교회 대부분의 교인들은 이 말이 당연하다고 생각합니다.","s":38.64,"e":42.74,"p":false,"h":false},{"t":"• 유교적 개념에 익숙해서 당연하게 받아들이고, 그래서 신앙 생활을 책임으로 감당하는 신자가 매우 많습니다.","s":42.936,"e":50.072,"p":false,"h":false},{"t":"• 신앙 생활을 의무와 책임으로 감당하게 되면 중요한 것이 빠져나갑니다.","s":50.424,"e":55.305,"p":false,"h":false},{"t":"기쁨과 자발성입니다.","s":55.512,"e":57.323,"p":false,"h":false},{"t":"그래서 교회 생활에 기쁨이 없고, 자율적으로 움직이지 않고, 타성에 젖은 신앙생활을 하게 됩니다.","s":57.528,"e":64.568,"p":false,"h":false},{"t":"• 이것은 하나님의 의도와 전혀 다릅니다.","s":64.92,"e":67.755,"p":false,"h":false},{"t":"하나님은 자기 자녀들의 자발성과 기꺼움을 만들기 위해 은혜라는 파격적인 방법으로 구원하셨는데, 책임과 의무는 그 파격적인 하나님의 노력을 허사로 돌아가게 하고 이 목적을 깨뜨립니다.","s":67.944,"e":80.75,"p":false,"h":false},{"t":"• 하나님이 원하시는 것은 하나님 자신을 기뻐하고 기꺼이 순종하는 것입니다.","s":81.072,"e":86.071,"p":false,"h":false},{"t":"하나님이 너무 좋아서 의욕적으로 하나님이 기뻐하시는 일을 스스로 찾아서 하는 자녀들입니다.","s":86.28,"e":92.3,"p":true,"h":false},{"t":"은혜는 책임이 면제된 자리.","s":92.904,"e":95.064,"p":false,"h":false},{"t":"• 은혜란 책임이 면제된 자리입니다.","s":95.256,"e":97.756,"p":false,"h":false},{"t":"그런데도 \"그래도 구원에 대한 책임을 가지고 말씀대로 살아야 합니다.\"라고 설교하는 목사님들이 많습니다.","s":97.968,"e":105.356,"p":false,"h":false},{"t":"• 말씀대로 사는 것은 받은 은혜에 대한 책임이나 의무 때문이 아니라, 그리스도의 사랑에 감화된 마음에서 우러나오는 자발적 순종입니다.","s":105.696,"e":114.771,"p":false,"h":false},{"t":"• 방종을 막기 위해 다시 책임을 말하는 것은 하나님이 애써 만들어 놓으신 사랑의 감화에 다시 짐을 지우는 격입니다.","s":115.128,"e":122.668,"p":false,"h":false},{"t":"책임을 요구하는 순간 자발성도 기꺼움도 사라지고, 교회 생활이 기쁨을 잃고 무거운 책임감으로 감당하게 됩니다.","s":123.024,"e":130.968,"p":false,"h":false},{"t":"그러나 하나님은 우리가 신나게 교회 생활 하기를 원하십니다.","s":131.304,"e":135.367,"p":false,"h":false},{"t":"• 하나님은 그 자발성과 기꺼움을 만들기 위해 성도들의 많은 시행착오와 실수를 참아 주십니다.","s":135.576,"e":142.101,"p":false,"h":false},{"t":"처음부터 옥죄지 않으십니다.","s":142.44,"e":144.776,"p":false,"h":false},{"t":"• 하나님의 기쁘신 뜻에 대해 책임감을 가지는 것과 그 뜻을 기꺼워하고 좋아하게 되는 것은 많이 다릅니다.","s":144.984,"e":151.67,"p":true,"h":false},{"t":"로마서 6장.","s":152.256,"e":153.532,"p":false,"h":false},{"t":"• 6장에서 바울이 말하는 것은 책임이 아니라 삶의 원리를 논리적으로 설명한 것입니다.","s":154.128,"e":159.909,"p":false,"h":false},{"t":"은혜로 구원 받았으면 은혜가 목적하는 방향으로 가야지, 무엇 때문에 굳이 죄를 지어도 괜찮다는 생각을 하느냐는 어리석음을 지적하는 말입니다.","s":160.128,"e":169.677,"p":true,"h":false},{"t":"\"책임.\"이라는 말: 서양과 유교권의 차이.","s":170.256,"e":173.952,"p":false,"h":false},{"t":"• 서양인이 생각하는 책임과 한중일 유교권에서 생각하는 책임은 전혀 다릅니다.","s":174.144,"e":179.494,"p":false,"h":false},{"t":"개혁파 신학 표준 문서들이 책임을 말한다는 점을 두고 AI와 논쟁했을 때 이 점을 지적하셨습니다.","s":179.712,"e":186.723,"p":false,"h":false},{"t":"• 한국인에게 책임을 말하면 반드시 강제성이 포함됩니다.","s":187.056,"e":191.056,"p":false,"h":false},{"t":"그래서 한국인은 책임을 진다 라고 말합니다.","s":191.256,"e":194.366,"p":false,"h":false},{"t":"책임은 짊어져야 할 무거움 짐을 의미합니다.","s":194.568,"e":197.806,"p":true,"h":false},{"t":"권면과 경고에 강제성이 있는가?","s":198.264,"e":200.71,"p":false,"h":false},{"t":"• 성경의 권면과 경고는 명령이기보다, 강제력이 없는 더 좋은 길에 대한, 성도다움에 대한 추천과 권고에 가깝습니다.","s":200.904,"e":209.658,"p":false,"h":false},{"t":"거기에 책임이라는 강제성은 없다고 봅니다.","s":210.024,"e":213.124,"p":false,"h":false},{"t":"• 롬 8:1-2: 생명의 성령의 법은 예수 그리스도께서 모든 책임을 지시고 우리를 모든 율법적 책임에서 해방시켜 주신 은혜의 법칙입니다.","s":213.312,"e":223.664,"p":false,"h":false},{"t":"해방시켜 주고 다시 책임을 지운다는 것은 하나님의 속성에 맞지 않습니다.","s":223.992,"e":229.028,"p":false,"h":false},{"t":"하나님은 항상 사랑의 권면으로 말씀하시며, 바울의 명령형도 강제나 억압이나 강요를 의미한다고 볼 수 없습니다.","s":229.224,"e":237.17,"p":true,"h":false},{"t":"• 롬 8:13: \"육신대로 살면 죽는다.\"는 것은 실제로 일어나지 않는 일입니다.","s":237.744,"e":244.55,"p":false,"h":false},{"t":"신자가 죽을 수도 있는 가능성을 염두에 두고 경계시키는 말이 아니라 영적 원리입니다.","s":244.752,"e":250.528,"p":false,"h":false},{"t":"육신대로 살면 반드시 죽는 것이 원리인데, 신자인 너희가 왜 그렇게 살겠느냐는 당위성을 말씀하신 것이지, 죽는 수도 있으니 조심하라는 뜻이 아닙니다.","s":250.872,"e":261.604,"p":false,"h":false},{"t":"성경은 견인 교리를 일관되게 말씀하고 있는데 전체의 사상적 조화를 가지고 설명해야 하며, 그렇지 않으면 앞뒤가 틀리게 됩니다.","s":261.936,"e":270.688,"p":false,"h":false},{"t":"• 목사님 자신은 이런 명령을 강제성을 배제한 부드러운 권면으로 읽을 때 훨씬 따르고 싶은 의욕과 감화가 생기고, 강제성을 띠면 반발이 일어난다고 하셨습니다.","s":271.032,"e":281.863,"p":true,"h":false},{"t":"2.","s":282.432,"e":282.715,"p":false,"h":false},{"t":"목사님의 간증.","s":282.912,"e":284.339,"p":false,"h":false},{"t":"하나님이 기다려 주셨다.","s":284.784,"e":286.593,"p":false,"h":false},{"t":"내가 죄를 지으려 할 때 하나님은 얼마든지 막으실 수 있었지만 내가 하고 싶은 대로 그냥 두셨습니다.","s":286.824,"e":293.462,"p":false,"h":false},{"t":"그 하고 싶어 하는 의욕을 꺾지 않으셨습니다.","s":293.808,"e":296.882,"p":false,"h":false},{"t":"만일 그때 꺾으셨다면 나는 눈치나 보는 목사가 되었을 것입니다.","s":297.096,"e":301.652,"p":false,"h":false},{"t":"하고 싶은 대로 죄 짓도록 두시되, 가책과 그 범죄가 가져오는 고통을 통해 스스로 깨닫게 하셨습니다.","s":301.848,"e":309.122,"p":false,"h":false},{"t":"이런 것들이 쌓이면서 나의 최선이 하나님 뜻대로 사는 데 있다는 사실을 스스로 터득하게 되었고, 하나님의 기쁘신 뜻을 의욕하게 되었습니다.","s":309.456,"e":318.967,"p":false,"h":false},{"t":"의욕을 꺾으신 것이 아니라 의욕이 바뀌도록 하셨습니다.","s":319.296,"e":323.145,"p":false,"h":false},{"t":"나의 자발성을 만들기 위해 하나님은 수십 년을 기다려 주셨고, 이제는 기꺼이 하나님을 즐거워하게 되었습니다.","s":323.352,"e":330.888,"p":true,"h":false},{"t":"네 번 긁은 차.","s":331.464,"e":332.983,"p":false,"h":false},{"t":"이사 온 아파트의 주차장이 비좁아서 차를 넣고 빼다가 네 번이나 남의 차를 긁었습니다.","s":333.336,"e":339.367,"p":false,"h":false},{"t":"그때마다 차에 있는 전화번호로 연락해 자진 신고했습니다.","s":339.72,"e":343.683,"p":false,"h":false},{"t":"수리비가 보통 60-70만 원이어서 수입 없는 은퇴 선교사에게는 큰 부담이었고, 마지막에는 아내에게 정말 미안했습니다.","s":343.896,"e":352.715,"p":false,"h":false},{"t":"마지막은 추석에 열차표를 예매해 둔 상태였기에 차 번호만 사진으로 찍어 두고, 추석이 지난 뒤 경비실에 연락해서 차 주인을 찾아 72만 원을 물어 주었습니다.","s":353.04,"e":363.776,"p":false,"h":false},{"t":"네 번의 과정에서 한 번도 망설인 적은 없습니다.","s":364.104,"e":367.498,"p":false,"h":false},{"t":"당연히 고쳐 줘야 한다고 생각했습니다.","s":367.704,"e":370.454,"p":false,"h":false},{"t":"하나님의 기쁘심을 먼저 생각했기 때문에 아까운 마음을 지울 수 있었습니다.","s":370.656,"e":375.589,"p":false,"h":false},{"t":"물론 실수하지 않았더라면 더 좋았겠지만 정직을 테스트 받았다는 것도 의미는 있었다고 생각합니다.","s":375.792,"e":382.405,"p":false,"h":false},{"t":"돈은 많은 손해를 봤지만 내가 정직하게 살 수 있다는 것이 오히려 감사했습니다.","s":382.776,"e":388.25,"p":false,"h":false},{"t":"하나님 덕분입니다.","s":388.44,"e":390.018,"p":true,"h":false},{"t":"어머니의 독촉.","s":390.48,"e":391.746,"p":false,"h":false},{"t":"어릴 때 공부하려고 생각하고 있는데 어머니가 갑자기 \"공부 안 하나?\"","s":392.352,"e":396.996,"p":false,"h":false},{"t":"하고 독촉하면 갑자기 하기 싫어졌습니다.","s":397.2,"e":400.194,"p":false,"h":false},{"t":"인간의 본성이 그렇다고 생각합니다.","s":400.392,"e":402.991,"p":false,"h":false},{"t":"그래서 하나님은 우리의 자원하는 마음을 만드시기 위해서 공을 들이고 계십니다.","s":403.2,"e":408.424,"p":false,"h":false},{"t":"인간의 자유의지를 존중하시는 것도 기꺼움을 요구하시는 것도 그것이라야 진정한 사랑이 되기 때문입니다.","s":408.624,"e":415.3,"p":false,"h":false},{"t":"거기서 자발성과 기꺼움이 빠지면 하나님 입장에서는 의미가 없습니다.","s":415.656,"e":420.596,"p":true,"h":false},{"t":"3.","s":421.2,"e":421.803,"p":false,"h":false},{"t":"AI의 의견과 합의 여부.","s":422.016,"e":424.255,"p":false,"h":false},{"t":"아래 \"AI.\"로 표시한 내용은 AI의 의견이며, 목사님이 동의하신 것이 아닙니다.","s":424.416,"e":431.115,"p":false,"h":false},{"t":"합의되지 않은 항목은 그대로 남겨 두었습니다.","s":431.304,"e":434.587,"p":true,"h":false},{"t":"로마서 6장.","s":435.048,"e":436.324,"p":false,"h":false},{"t":"• AI: 처음에는 \"바울이 반론을 막는다.\"고 썼으나, 목사님 지적대로 6장은 책임 추궁이 아니라 은혜의 논리를 설명하는 본문이라는 읽기가 본문(6:2 \"그럴 수 없느니라.\", 6:3 \"알지 못하느냐?\", 6:14)과 맞다고 인정했습니다.","s":436.92,"e":456.366,"p":false,"h":false},{"t":"다만 6:13, 6:16에 명령형이 있어 독자가 \"역시 책임을 말하네.\"","s":456.576,"e":462.885,"p":false,"h":false},{"t":"하고 돌아갈 수 있으니, 6:11의 정체성 선언이 먼저 나오고 명령이 뒤따른다는 점을 한 줄 짚자고 제안했습니다.","s":463.08,"e":471.291,"p":false,"h":false},{"t":"• 상태: 본문 읽기는 일치.","s":471.624,"e":474.059,"p":false,"h":false},{"t":"명령형 설명을 덧붙일지는 목사님이 결정.","s":474.24,"e":477.339,"p":true,"h":false},{"t":"권면과 명령형의 강제성.","s":477.768,"e":479.929,"p":false,"h":false},{"t":"• AI: 8:1-2와 8:15는권면과 명령에 강제성은 없다는 목사님 주장의 매우 강력한 근거라고 보았습니다.","s":480.12,"e":489.231,"p":false,"h":false},{"t":"다만 \"강제성이 전혀 없다.\", \"명령형이 아니다.\"까지 말하면, 로마서 12-16장에 문법적으로 명령형이 많은 점과 어긋난다고 보았습니다.","s":489.576,"e":500.572,"p":false,"h":false},{"t":"\"명령이지만 처벌을 담보한 강요가 아니라 사랑의 권면\"이라는 표현을 대안으로 제안했습니다.","s":500.904,"e":507.24,"p":false,"h":false},{"t":"• 상태: 목사님은 8:1-2를 근거로 생명의 성령의 법이 죄와 사망의 법에서 해방하였다고 말씀하시면서 해방시켜 주고선 다시 강제성을 가진 명령을 하신다는 사실은 하나님의 속성에 맞지 않는다고 하시면서 \"강제성이 없다.\"는 주장을 더 강하게 하셨고, 죄와 사망의 법은 율법이며 해방하였다는 말은 율법적 책임에서 면제시켜 주셨다는 말이며 이 약속은 어떤 경우에도 해지되지 않는다고 주장하셨습니다.","s":507.6,"e":536.801,"p":false,"h":false},{"t":"(롬 8:33-35) \"누가 능히 하나님께서 택하신 자들을 고발하리요 의롭다 하신 이는 하나님이시니 누가 정죄하리요 죽으실 뿐 아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 간구하시는 자시니라 누가 우리를 그리스도의 사랑에서 끊으리요 환난이나 곤고나 박해나 기근이나 적신이나 위험이나 칼이랴 \" 그러나 AI는 위 우려를 유지합니다.","s":537.12,"e":564.003,"p":false,"h":false},{"t":"결국 합의되지 않음.","s":564.192,"e":565.78,"p":true,"h":false},{"t":"롬 8:13.","s":566.208,"e":567.98,"p":false,"h":false},{"t":"• AI: \"협박이 아니라 영적 원리를 알려 주는 말씀.\"이라는 읽기는 8:1, 8:14, 8:38-39와 조화되어 설득력 있다고 보았습니다.","s":568.176,"e":580.273,"p":false,"h":false},{"t":"다만 \"실제로 일어나지 않는 일.\"이라는 단정은 신학 전통에 따라 읽기가 갈리는 부분(개혁파의 견인 방편, 알미니안의 실제 가능성, \"죽음\"의 의미)이어서 반대 전통이 곧바로 반박할 수 있다고 보았습니다.","s":580.632,"e":596.245,"p":false,"h":false},{"t":"\"앞뒤가 안 맞는다.\"는 문제는 반대편도 같은 무게로 안고 있고, 갈리는 것은 어느 본문을 기준점으로 삼느냐라고 했습니다.","s":596.568,"e":605.471,"p":false,"h":false},{"t":"• 상태: 협박이 아니라는 읽기는 일치.","s":605.808,"e":608.906,"p":false,"h":false},{"t":"\"일어나지 않는다.\"는 단정을 쓸지, \"8:1과 8:38-39를 기준점으로 삼은 해석.\"이라고 밝힐지는 합의되지 않음.","s":609.096,"e":619.246,"p":false,"h":false},{"t":"개혁파 표준 문서와 \"책임.\"","s":619.416,"e":621.8,"p":true,"h":false},{"t":"• AI: 하이델베르크 요리문답은 죄책·구원·감사로 나누고 순종을 감사 부분에 두며, 웨스트민스터 신앙고백서는 선행을 믿음의 열매와 증거로 말한다고 설명했습니다.","s":622.224,"e":634.514,"p":false,"h":false},{"t":"따라서 문서에 책임이라는 단어가 있다고 곧바로 율법주의는 아니라고 보았습니다.","s":634.848,"e":640.147,"p":false,"h":false},{"t":"문화권 차이와 한국어 \"책임\"에 처벌이 따라붙는다는 목사님 지적은 근거가 있다고 인정했습니다.","s":640.344,"e":647.207,"p":false,"h":false},{"t":"• 상태: 한국어 \"책임\"의 문제는 일치.","s":647.544,"e":651.328,"p":false,"h":false},{"t":"표준 문서 자체를 어떻게 평가할지에 대한 목사님의 입장은 대화에서 분명히 정해지지 않았습니다.","s":651.528,"e":657.918,"p":true,"h":false},{"t":"책임을 지우는 설교를 어떻게 다룰 것인가?","s":658.512,"e":661.418,"p":false,"h":false},{"t":"• AI: 목사님의 진단(책임으로 감당하는 신앙은 신앙생활의 기쁨과 자발성을 잃게 한다)은 현장을 오래 보신 분의 통찰로 타당하다고 보았습니다.","s":661.608,"e":672.716,"p":false,"h":false},{"t":"물론 성도의 방종을 우려한 목회적 차원에서 그렇게 설교하셨겠지만 유익 보다는 잃는 게 더 크다는 생각이셨습니다.","s":673.056,"e":680.737,"p":false,"h":false},{"t":"AI는 그래도 목회적 배려에서 할 수 있는 설교이며 성도를 아끼는 마음은 존중해야 한다고 제안했습니다.","s":681.072,"e":688.066,"p":true,"h":false},{"t":"• 상태: 목사님은 이 제안에 대해 명시적으로 답하지 않으셨습니다.","s":688.656,"e":693.437,"p":false,"h":false},{"t":"미확정.","s":693.648,"e":694.608,"p":false,"h":false},{"t":"(미확정이 아니라 책임으로 요구하는 것은 신앙생활의 기꺼움을 방해한다고 생각한다.","s":695.52,"e":701.07,"p":false,"h":false},{"t":"그리스도의 은혜를 설명하여 성령의 감화를 받도록 설교하고 오직 성령의 감화만이 사람을 변화시켜 놓는다고 생각한다.","s":701.28,"e":708.993,"p":false,"h":false},{"t":"성도들에게 책임을 지우는 것은 전혀 도움이 되지 않으며 하나님의 방법도 아니다.)","s":709.176,"e":714.476,"p":true,"h":false},{"t":"\"예수께서 모든 책임을 지셨다.\"는 표현.","s":714.912,"e":718.438,"p":false,"h":false},{"t":"• AI: 죄책과 정죄에서의 해방이라는 뜻이면 정확하지만, 독자가 \"삶에 대한 어떤 요청도 없다.\"로 들을 수 있으니 \"정죄에서 해방되었다.\"와 \"그래서 사랑으로 응답한다.\"를 한 쌍으로 쓰자고 제안했습니다.","s":718.632,"e":734.468,"p":false,"h":false},{"t":"(어떤 요청도 들을 수 없다는 것은 억측에 지나지 않는다.","s":734.808,"e":738.696,"p":false,"h":false},{"t":"성경은 구원 받은 사람들에게 수많은 요구를 하고 있고 성도의 삶의 마땅한 모본 들을 제시하고 있다.","s":738.912,"e":745.665,"p":false,"h":false},{"t":"다만 그런 요구들이 짊어져야 할 책임으로 요구되지 않고 쉽고 가벼운 짐으로 말씀하고 있다.","s":746.064,"e":751.921,"p":false,"h":false},{"t":"쉽고 가벼운 짐은 기꺼운 마음으로 감당하는 순종을 의미한다.","s":752.184,"e":756.503,"p":false,"h":false},{"t":"거기에 강제성을 띤 무거움은 없다는 뜻이다.","s":756.696,"e":759.842,"p":true,"h":false},{"t":"• 상태: 미확정.","s":760.296,"e":762.207,"p":false,"h":false},{"t":"용어 \"응답\".","s":762.408,"e":763.762,"p":false,"h":false},{"t":"• AI: 용어 풀이에 \"한국어의 책임에는 처벌이 따라붙지만, 성경이 말하는 것은 사랑받은 자의 응답.\"이라고 쓰자고 제안했습니다.","s":764.28,"e":774.031,"p":false,"h":false},{"t":"• 상태: 목사님의 채택 여부는 아직 없습니다.","s":774.216,"e":777.725,"p":false,"h":false},{"t":"4.","s":777.936,"e":778.355,"p":false,"h":false},{"t":"AI가 바로잡은 점 • 6장 해설에서 \"바울이 반론을 막는다.\"고 표현한 것을 목사님 지적에 따라 수정했습니다.","s":778.56,"e":786.625,"p":true,"h":false},{"t":"5.","s":787.224,"e":787.521,"p":false,"h":false},{"t":"아직 결정되지 않은 것.","s":787.68,"e":789.426,"p":false,"h":false},{"t":"• 권면과 명령형을 \"강제성이 전혀 없다.\"로 쓸지, \"강요가 아닌 사랑의 권면.\"으로 쓸지 • 롬 8:13을 \"일어나지 않는 일.\"로 쓸지, 기준 본문을 밝히고 한 가지 읽기로 제시할지 • \"책임\" 대신 \"응답\"이라는 용어를 쓸지 • 서문에 \"은혜가 만드는 자발적 순종을 중심에 두고 읽는다.\"는 입장 표시를 넣을지 • 7장의 \"나\"와 11:20-22의 \"두려워하라.\"를 어떻게 읽을지 • 성경 번역본, 본문을 앱에 직접 수록할지 구절 번호만 달지","s":789.624,"e":823.259,"p":true,"h":false}], NAV = null;
  const SPEEDS = [0.8, 1, 1.2, 1.5], FS = [18, 20, 22, 25, 28, 32];
  const KEY = 'narr:' + TITLE + ':' + AUDIO_SRC;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0;
  const audio = new Audio(AUDIO_SRC);
  audio.preload = 'metadata';

  function pref(k, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + k); } localStorage.setItem(KEY + ':' + k, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }

  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }

  /* 글 그리기 */
  (function build() {
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(DUR || (SEGS.length ? SEGS[SEGS.length - 1].e : 0)) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(DUR);
  })();

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let k = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { k = i; } else { break; } } return k; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = audio.duration || DUR || 0;
    $('cur').textContent = fmt(t);
    if (d > 0) { $('fill').style.width = Math.min(100, t / d * 100) + '%'; $('tot').textContent = fmt(d); }
    mark(idxAt(t), playing);
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); pref('pos', audio.currentTime || 0); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { audio.currentTime = Math.max(0, Math.min(t, (audio.duration || DUR || t))); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => { if (!playing) { paint(); } });
  audio.addEventListener('loadedmetadata', () => { $('tot').textContent = fmt(audio.duration); });
  audio.addEventListener('ended', () => { setPlaying(false); pref('pos', 0); const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1; });
  /* 글 이동: 앞 글·다음 글 단추를 눌렀을 때만 이동합니다 (자동으로 넘어가지 않음) */
  const navApi = { to: h => { location.href = h; } };
  function goNext() { if (NAV && NAV.next) { pref('pos', 0); navApi.to(NAV.next.href + '#cont'); } }

    const pt = $('pt'), nt = $('nt');
    if (!NAV) { pt.style.display = 'none'; nt.style.display = 'none'; return; }
    if (NAV.prev) { pt.title = '앞 글: ' + NAV.prev.title; pt.onclick = () => navApi.to(NAV.prev.href); } else { pt.style.display = 'none'; }
    if (NAV.next) {
      nt.title = '다음 글: ' + NAV.next.title; nt.onclick = () => navApi.to(NAV.next.href + '#cont');
      $('nvname').textContent = NAV.next.title; $('nvgo').href = NAV.next.href + '#cont'; $('nvcard').style.display = 'block';
    } else { nt.style.display = 'none'; }
    if (NAV.list) { const tl = $('tolist'); tl.href = NAV.list; tl.style.display = 'inline-block'; }
  })();
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일이 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = audio.duration || DUR || 0; seek(((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', () => { pref('pos', audio.currentTime || 0); });

  /* 앞 글이 끝나서 열린 경우: 처음부터 자동 재생을 시도하고, 폰이 막으면 ▶ 재생을 기다립니다 */
  const arrived = location.hash === '#cont';
  if (arrived) { pref('pos', 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  /* 이어 듣기 */
  const pos = parseFloat(pref('pos'));
  if (pos > 10 && pos < (DUR || 1e9) - 5) {
    const r = $('resume'); r.style.display = 'block';
    r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
    $('rb').onclick = () => { seek(pos); r.style.display = 'none'; play(); };
  }
  if (arrived) {
    $('resume').style.display = 'none';
    const n = $('nvnote'); n.style.display = 'block'; n.innerHTML = '다음 글을 열었습니다. 소리가 안 나오면 아래 <b>▶ 재생</b>을 눌러 주세요.';
    $('play').classList.add('wait');
    const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); }
    audio.addEventListener('playing', () => { $('play').classList.remove('wait'); if (!n.getAttribute('data-cd')) { n.style.display = 'none'; } }, { once: true });
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    /* F 키: 전체 화면 켜기/끄기 (한글 입력 상태에서도 같은 자리의 키면 동작) */
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, seek, toggle, mark, idxAt, audio, navApi, goNext };
})();
</script>
</body>
</html>
